seed: 42

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  max_tokens: 16
  temperature: 0.0

serving:
  # Local Mac default: mock. On CUDA hosts set to vllm.
  backend: mock  # mock | vllm
  gpu_memory_utilization: 0.9
  max_model_len: 32768
  # Qwen3-VL + vLLM: avoid HF re-resize crushing spatial tokens
  do_resize: false
  # Freeze Qwen3-VL video processor policy (reference per-frame pixel cap).
  cap_pixels_per_frame: true
  # Discarded generates after each new engine (mandatory for paper latency).
  warmup_generates: 2

dataset:
  name: Video-MME
  hf_repo: lmms-lab/Video-MME
  root: data/videomme
  subtitle: false
  # start small; expand only after pipeline works
  default_limit: 20

video:
  baseline_num_frames: 32
  max_pixels: 360360  # ~360*420*2.4-ish; keep fixed across pruning rates
  fps: null  # if set, overrides num_frames sampling

pruning:
  rates: [0.0, 0.25, 0.5, 0.75]
  # Real vLLM: engine-level token pruning AFTER vision encoder (not frame drop).
  # Frames stay fixed at video.baseline_num_frames for all rates.
  kind: vllm_video_token_prune
  video_pruning_method: vidcom2  # vidcom2 | evs (EVS as ablation only)
  # retained_tokens_est ≈ visual_tokens_pre * (1 - rate)

complexity:
  num_frames: 8
  alpha_motion: 0.7
  beta_scene: 0.3
  scene_threshold: 0.35
  # SMOKE / local defaults only. For paper runs:
  #   python -m src.calibrate_thresholds --predictions ... --complexity ...
  # then freeze the chosen values here (or pass --t1/--t2).
  t1: 0.15
  t2: 0.40
  calibration_fraction: 0.3

paths:
  results_dir: results
  predictions_dir: results/predictions
  metrics_dir: results/metrics
  figures_dir: results/figures

# Durable storage for RunPod / cloud runs.
# Pipeline start calls `python -m src.s3_sync ensure` which:
#   - resolves bucket (env / config / auto budgetvlm-<account_id>)
#   - creates it if missing
#   - updates block-public-access + SSE-S3 encryption
# Pipeline end uploads results under <uri>/<run_id>/
#
# Env on the pod:
#   AWS_ACCESS_KEY_ID=...
#   AWS_SECRET_ACCESS_KEY=...
#   AWS_DEFAULT_REGION=us-east-1
#   BUDGETVLM_AWS_ACCOUNT_ID=704052814573   # optional pin
#   BUDGETVLM_S3_BUCKET=budgetvlm-704052814573  # optional pin
s3:
  enabled: true
  auto_create: true
  uri: null
  bucket: null       # default: budgetvlm-<account_id>
  prefix: results
  region: us-east-1
  block_public_access: true
  ensure_encryption: true
  ensure_versioning: false
